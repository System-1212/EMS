  return `<svg class="colchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average and highest active power per machine">${g}</svg>`;
}

function buildCompare() {
  const el = document.getElementById("sec-cmp");
  const today = toDateStr(Date.now());
  const groupList = (g, title) => `<p class="grp-h">${title}</p><div class="dev-list">
      ${METERS.filter(m => m.group === g).map(m => `<label><input type="checkbox" value="${m.id}"> ${esc(m.label)}</label>`).join("")}</div>`;
  el.innerHTML = `
    <p class="intro">Compare machines side by side over the same period: how much energy each one used, what it cost, its average active power and its highest active power peak. Choose the period, enter the per unit cost and pick 2 or more machines.</p>
    <div class="controls">
      <fieldset class="panel">
        <legend>PERIOD</legend>
        <label>Period
          <select class="f-preset">
            <option value="today">Today</option><option value="yesterday">Yesterday</option><option value="last24">Last 24 hours</option>
            <option value="last7">Last 7 days</option><option value="thismonth">This month</option><option value="lastmonth">Last month</option>
            <option value="last3m">Last 3 months</option><option value="custom">Choose dates and times</option>
          </select>
        </label>
        <div class="custom four" hidden>
          <label>From date <input type="date" class="f-fd" value="${today}" max="${today}"></label>
          <label>From time <input type="time" class="f-ft" value="00:00" step="3600"></label>
          <label>To date <input type="date" class="f-td" value="${today}" max="${today}"></label>
          <label>To time <input type="time" class="f-tt" value="23:59"></label>
        </div>
        <label>Compare per
          <select class="f-group"><option value="hour">Hour</option><option value="day">Day</option><option value="month">Month</option></select>
        </label>
        <p class="range-text"></p>
      </fieldset>

      <fieldset class="panel">
        <legend>COST</legend>
        <div class="rate-row">
          <label>Currency <input type="text" class="f-cur" maxlength="5" value="${esc(savedCur())}"></label>
          <label>Per unit cost (per kWh) <input type="number" class="f-rate rate-big" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 52.50" value="${esc(savedRate())}"></label>
        </div>
        <p class="hint-s">The same per unit cost is used for every machine, so cost follows energy. It is shared with the other tabs.</p>
      </fieldset>

      <fieldset class="panel">
        <legend>RANK MACHINES BY</legend>
        <label class="chk"><input type="radio" name="cmp-order" value="energy" checked> Energy and cost <small>kWh</small></label>
        <label class="chk"><input type="radio" name="cmp-order" value="peak"> Highest active power peak <small>kW</small></label>
        <label class="chk"><input type="radio" name="cmp-order" value="avg"> Average active power <small>kW</small></label>
        <p class="hint-s">Tables and bar charts list the machines in this order. Every report includes all three.</p>
      </fieldset>

      <fieldset class="panel wide">
        <legend>MACHINES TO COMPARE</legend>
        <div class="dev-tools">
          <button type="button" class="linkbtn sel-dist">Select all distribution</button>
          <button type="button" class="linkbtn sel-none">Clear</button>
          <span class="dev-count"></span>
        </div>
        ${groupList("dist", "Distribution")}
        ${groupList("gen", "Generation")}
      </fieldset>
    </div>
    <div class="actions">
      <button type="button" class="btn primary run">COMPARE MACHINES</button>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Download progress" hidden>
        <div class="p-top"><span class="p-title">Downloading data, please wait…</span><span class="p-pct">0%</span></div>
        <div class="p-track"><div class="p-fill"></div></div>
        <div class="p-sub">Connecting to the data server</div>
      </div>
      <div class="banner" role="alert" hidden><strong class="b-head"></strong><span class="b-text"></span></div>
      <span class="status" role="status" aria-live="polite"></span>
    </div>
    <div class="results panel"></div>`;

  const $ = s => el.querySelector(s);
  const boxes = [...el.querySelectorAll(".dev-list input")];
  const state = { metric: "cost" };
  const selection = () => ({ preset: $(".f-preset").value, fromDate: $(".f-fd").value, fromTime: $(".f-ft").value, toDate: $(".f-td").value, toTime: $(".f-tt").value });
  function updateRangeText(setGroup) {
    $(".custom").hidden = $(".f-preset").value !== "custom";
    try { const r = rangeFor(selection(), Date.now()); if (setGroup) $(".f-group").value = defaultGroup(r); $(".range-text").textContent = "Period: " + fmtRange(r); }
    catch (e) { $(".range-text").textContent = e.message; }
  }
  function updateCount() {
    const n = boxes.filter(b => b.checked).length;
    $(".dev-count").textContent = n + " selected" + (n < 2 ? ", choose at least 2" : "");
  }
  $(".f-preset").addEventListener("change", () => updateRangeText(true));
  [".f-fd", ".f-ft", ".f-td", ".f-tt"].forEach(s => ["change", "input"].forEach(ev => $(s).addEventListener(ev, () => updateRangeText(true))));
  $(".sel-dist").addEventListener("click", () => { boxes.forEach(b => b.checked = METERS.find(m => m.id === b.value).group === "dist"); updateCount(); });
  $(".sel-none").addEventListener("click", () => { boxes.forEach(b => b.checked = false); updateCount(); });
  boxes.forEach(b => b.addEventListener("change", updateCount));
  [".f-rate", ".f-cur"].forEach(s => $(s).addEventListener("input", () => {
    saveRate($(".f-rate").value, $(".f-cur").value.trim() || CONFIG.currency);
    document.querySelectorAll(".f-rate").forEach(x => { if (x !== $(".f-rate")) x.value = $(".f-rate").value; });
    document.querySelectorAll(".f-cur").forEach(x => { if (x !== $(".f-cur")) x.value = $(".f-cur").value; });
  }));
  el.querySelectorAll('input[name="cmp-order"]').forEach(r => r.addEventListener("change", () => { if (state.data) render(); }));

  const prog = makeProgress($(".progress"));
  const showError = (h, t) => { $(".b-head").textContent = h; $(".b-text").textContent = t; $(".banner").hidden = false; };

  $(".run").addEventListener("click", async () => {
    $(".banner").hidden = true; $(".status").textContent = "";
    const ids = boxes.filter(b => b.checked).map(b => b.value);
    const rate = Number($(".f-rate").value), cur = $(".f-cur").value.trim() || CONFIG.currency;
    let range, group;
    try {
      range = rangeFor(selection(), Date.now());
      group = $(".f-group").value;
      if (!(rate > 0)) throw new Error("Enter the per unit cost (the price of 1 kWh) in the Cost box.");
      if (ids.length < 2) throw new Error("Select at least 2 machines to compare.");
      if (group === "hour" && range.stop - range.start > 62 * DAY) throw new Error("Comparing per hour works for up to 62 days. Choose per day or per month for longer periods.");
    } catch (e) { showError("Check the selection.", e.message); return; }
    $(".run").disabled = true; prog.start();
    try {
      const sel = METERS.filter(m => ids.includes(m.id));
      const data = await loadAll(sel, range, ["pTotal"], (d, t) => prog.step(d, t));
      prog.calc();
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 120)));
      Object.assign(state, { data, range, group, rate, cur, meters: sel, generated: Date.now() });
      render(); prog.finish();
      $(".status").textContent = "Updated " + fmtTime(state.generated) + " PKT";
    } catch (e) { prog.hide(); showError("Could not create the comparison.", e.message); }
    finally { $(".run").disabled = false; }
  });

  /* ---------- calculation ---------- */
  function compute() {
    const { data, range, group, rate, meters } = state;
    const multiDay = dayStart(range.start) !== dayStart(range.stop - 1);
    const bks = buckets(range, group).map(b => ({ ...b, label: bucketLabel(b, group, multiDay), axis: axisLabel(b, group, multiDay) }));
    const list = meters.map((m, i) => {
      const d = data[m.id];
      const r = { m, d, color: PALETTE[i % PALETTE.length], kwh: d.total, cost: d.total * rate, has: d.hasData };
      const pt = d.params.pTotal;
      if (pt) {
        r.avg = Math.abs(pt.avg);
        // highest power in either direction (a reversed CT shows load as negative power)
        const hi = pt.peak, lo = pt.low;
        const useLow = lo && (!hi || Math.abs(lo.v) > Math.abs(hi.v));
        r.peak = useLow ? { v: Math.abs(lo.v), t: lo.t, reverse: true } : hi ? { v: hi.v, t: hi.t } : null;
        r.series = bks.map(b => { const v = [...pt.mean].filter(([t]) => t >= b.s && t < b.e).map(([, v]) => Math.abs(v)); return v.length ? v.reduce((a, c) => a + c, 0) / v.length : null; });
      } else {
        const hrs = d.hours.filter(h => h.src).length;
        r.avg = hrs ? d.total / hrs : null; r.peak = null; r.series = bks.map(() => null);
      }
      r.peakHour = r.peak ? hourOf(d, r.peak.t) : null;
      r.lf = r.peak && r.peak.v > 0 && isNum(r.avg) ? Math.min(1, r.avg / r.peak.v) : null;
      r.bk = bks.map(b => {
        let k = 0, has = false;
        d.hours.forEach(h => { if (h.t >= b.s && h.t < b.e && h.src) { k += h.kwh; has = true; } });
        return has ? k : null;
      });
      const bi = r.bk.reduce((best, v, i) => (v !== null && (best < 0 || v > r.bk[best])) ? i : best, -1);
      r.topBk = bi >= 0 ? { b: bks[bi], kwh: r.bk[bi] } : null;
      r.leads = 0;
      return r;
    });
    bks.forEach((b, i) => {
      const vals = list.map(r => r.bk[i]);
      const mx = Math.max(...vals.filter(v => v !== null));
      b.leader = vals.some(v => v !== null && v > 0) ? list.findIndex(r => r.bk[i] === mx) : -1;
      if (b.leader >= 0) list[b.leader].leads++;
      b.total = vals.reduce((s, v) => s + (v || 0), 0);
      b.has = vals.some(v => v !== null);
    });
    const total = list.reduce((s, r) => s + r.kwh, 0);
    list.forEach(r => r.share = total > 0 ? r.kwh / total : 0);
    const withData = list.filter(r => r.has);
    const byEnergy = [...withData].sort((a, b) => b.kwh - a.kwh);
    const withPeak = withData.filter(r => r.peak);
    const byPeak = [...withPeak].sort((a, b) => b.peak.v - a.peak.v);
    const topPeak = byPeak[0] || null;
    list.forEach(r => r.topPeak = r === topPeak);
    const order = (el.querySelector('input[name="cmp-order"]:checked') || {}).value || "energy";
    const key = { energy: r => r.kwh, peak: r => r.peak ? r.peak.v : -1, avg: r => isNum(r.avg) ? r.avg : -1 }[order];
    const ranked = [...withData].sort((a, b) => key(b) - key(a));
    return { bks, list, total, cost: total * rate, withData, byEnergy, byPeak, topPeak, ranked, order, multiDay,
             missing: list.filter(r => !r.has) };
  }

  /* ---------- report ---------- */
  function render() {
    const { range, rate, cur, group } = state;
    const C = state.c = compute();
    const gw = GROUP_WORD[group];
    const orderText = { energy: "energy and cost", peak: "highest active power peak", avg: "average active power" }[C.order];
    const head = `
      <div class="rep-head">
        <div class="rep-id">
          <span class="rep-logo-tile"><img class="rep-logo" src="${document.getElementById("brandLogo").src}" alt="Toyo Packaging"></span>
          <div>
            <h3>Machine comparison: energy, cost and active power</h3>
            <p class="meta"><b>Period:</b> ${esc(fmtRange(range))}<br>
              <b>Machines:</b> ${esc(state.meters.map(m => m.label).join(", "))}<br>
              <b>Per unit cost:</b> ${esc(cur)} ${fmt(rate, 2)} per kWh &nbsp;&nbsp;<b>Compared per:</b> ${gw} &nbsp;&nbsp;<b>Ranked by:</b> ${orderText}
              &nbsp;&nbsp;<b>Generated:</b> ${esc(fmtDateTime(state.generated))} PKT</p>
          </div>
        </div>
        <div class="rep-tools">
          <button type="button" class="btn f-print">PRINT REPORT</button>
          <button type="button" class="btn f-csv">DOWNLOAD CSV</button>
        </div>
      </div>`;
    let body;
    if (C.withData.length < 1) {
      body = "<p>No readings in this period for the selected machines. Choose another period, or check that the logger was running.</p>";
    } else {
      const top = C.byEnergy[0], low = C.byEnergy[C.byEnergy.length - 1];
      const kpis = `<div class="kpis">
        <div class="kpi main"><div class="k">Compared total</div><div class="v">${fmtKwh(C.total)}<small>kWh</small></div>
          <div class="s">${C.withData.length} of ${C.list.length} machines with readings</div></div>
        <div class="kpi cost"><div class="k">Compared cost</div><div class="v">${esc(money(C.cost, cur))}</div>
          <div class="s">At ${esc(cur)} ${fmt(rate, 2)} per kWh</div></div>
        <div class="kpi" style="--c:${top.color}"><div class="k">Highest consumer</div><div class="v">${esc(top.m.label)}</div>
          <div class="s">${fmtKwh(top.kwh)} kWh, ${esc(money(top.cost, cur))}, ${pct(top.share)}${C.byEnergy.length > 1 && low.kwh > 0 ? `<br>${(top.kwh / low.kwh).toFixed(1)}× ${esc(low.m.label)}` : ""}</div></div>
        <div class="kpi peak"><div class="k">Highest power peak</div><div class="v">${C.topPeak ? fmt(C.topPeak.peak.v, 2) + "<small>kW</small>" : "–"}</div>
          <div class="s">${C.topPeak ? esc(C.topPeak.m.label) + ", " + esc(fmtDateTime(C.topPeak.peak.t)) + " PKT" : "No power readings"}</div></div>
      </div>`;
      const slices = C.byEnergy.filter(r => r.kwh > 0).map(r => ({ name: r.m.label, value: r.cost, color: r.color }));
      const legend = slices.map(s => `<li><span class="dot" style="--c:${s.color}"></span><span>${esc(s.name)}<br><small style="color:var(--muted)">${esc(money(s.value, cur))}, ${fmtKwh(s.value / rate)} kWh</small></span><span class="pct">${pct(C.cost > 0 ? s.value / C.cost : 0)}</span></li>`).join("");
      body = kpis + `
        <div class="card summary"><h2>SUMMARY</h2><div class="sum-text">${summary(C)}</div></div>
        ${comparisonTable(C)}
        <div class="charts">
          <div class="card"><h2>COST SHARE</h2><p class="sub">Each machine's part of the compared cost</p>
            ${C.cost > 0 ? `<div class="donut-wrap">${donutChart(slices, C.cost, short(C.cost), cur + " total", v => money(v, cur))}<ul class="legend">${legend}</ul></div>` : "<p>No energy recorded.</p>"}
          </div>
          <div class="card"><h2>COST AND ENERGY BY MACHINE</h2><p class="sub">Ranked by ${orderText}. Bar length is cost; kWh is in the table.</p>
            ${hBars(C.ranked.map(r => ({ name: r.m.label, value: r.cost, color: r.color })), v => money(v, cur))}
          </div>
        </div>
        <div class="card" style="margin-top:16px"><h2>AVERAGE AND HIGHEST ACTIVE POWER</h2>
          <p class="sub">Light column: average active power. Solid column: highest single reading. The highest peak of all machines has a red outline.</p>
          ${C.withData.some(r => r.peak) ? powerColumns(C.ranked.map(r => ({ name: r.m.label, color: r.color, avg: r.avg, peak: r.peak ? r.peak.v : null, top: r.topPeak })), "kW") : "<p>No active power readings for these machines.</p>"}
        </div>
        <div class="card" style="margin-top:16px">
          <div class="card-head"><h2 class="per-title"></h2></div>
          <div class="card-tools"><label>Show <select class="f-metric"><option value="cost">Cost (${esc(cur)})</option><option value="kwh">Energy (kWh)</option></select></label><span class="print-only"></span></div>
          <div class="per-chart"></div>
          <div class="legend-inline">${C.list.map(r => `<span><i style="--c:${r.color}"></i>${esc(r.m.label)}</span>`).join("")}</div>
        </div>
        <div class="card" style="margin-top:16px"><h2>ACTIVE POWER TREND</h2>
          <p class="sub">Average active power per ${gw} for each machine. The circle marks the highest peak.</p>
          ${powerTrend(C)}
          <div class="legend-inline">${C.list.map(r => `<span><i style="--c:${r.color}"></i>${esc(r.m.label)}</span>`).join("")}</div>
        </div>
        ${periodTable(C)}
        <div class="card explain" style="margin-top:16px"><h2>HOW THIS COMPARISON IS CALCULATED</h2>${explanation()}</div>`;
    }
    $(".results").innerHTML = head + `<div class="rep-body">${body}
      <p class="rep-foot">Toyo Packaging, Advanced Energy Management System. Source: Toyo energy cloud. All times PKT.</p></div>`;
    $(".f-print").addEventListener("click", () => window.print());
    $(".f-csv").addEventListener("click", downloadCsv);
    const met = $(".f-metric");
    if (met) { met.value = state.metric; met.addEventListener("change", () => { state.metric = met.value; drawPer(); }); drawPer(); }
  }

  function drawPer() {
    const C = state.c, cur = state.cur, cost = state.metric === "cost", gw = GROUP_WORD[state.group];
    $(".per-title").textContent = (cost ? "COST" : "ENERGY") + " PER " + gw.toUpperCase() + ", MACHINE BY MACHINE";
    $(".card-tools .print-only").textContent = cost ? "In " + cur : "In kWh";
    $(".per-chart").innerHTML = lineChart(C.bks.map(b => b.axis),
      C.list.map(r => ({ name: r.m.label, color: r.color, values: r.bk.map(v => v === null ? null : cost ? v * state.rate : v) })),
      cost ? cur : "kWh", null) || "<p>No readings.</p>";
  }

  function powerTrend(C) {
    let mark = null;
    if (C.topPeak) {
      const i = C.bks.findIndex(b => C.topPeak.peak.t >= b.s && C.topPeak.peak.t < b.e);
      mark = { i, v: C.topPeak.peak.v, text: "Highest " + fmt(C.topPeak.peak.v, 1) + " kW (" + C.topPeak.m.label + ")" };
    }
    return lineChart(C.bks.map(b => b.axis), C.list.map(r => ({ name: r.m.label, color: r.color, values: r.series })), "kW", mark)
      || "<p>No active power readings for these machines.</p>";
  }

  function comparisonTable(C) {
    const { cur, rate, group } = state, gw = GROUP_WORD[group];
    const minK = Math.min(...C.byEnergy.map(r => r.kwh).filter(v => v > 0));
    const rows = [...C.ranked, ...C.missing].map((r, i) => {
      if (!r.has) return `<tr><td><span class="dot" style="--c:var(--grid)"></span>&nbsp; ${esc(r.m.label)}</td><td colspan="11" class="flag">No readings in this period</td></tr>`;
      const ph = r.peakHour, hs = r.peak ? Math.floor(r.peak.t / HOUR) * HOUR : 0;
      return `<tr${i === 0 ? ' class="peak"' : ""}>
        <td><span class="dot" style="--c:${r.color}"></span>&nbsp; ${esc(r.m.label)}${i === 0 ? '<span class="tag-peak">#1</span>' : ""}</td>
        <td class="n kwh">${fmtKwh(r.kwh)}</td><td class="n cost">${esc(money(r.cost, cur))}</td>
        <td class="n">${pct(r.share)}<span class="share"><i style="width:${(r.share * 100).toFixed(1)}%;--c:${r.color}"></i></span></td>
        <td class="n">${r.kwh > 0 && isFinite(minK) ? (r.kwh / minK).toFixed(1) + "×" : "–"}</td>
        <td class="n">${isNum(r.avg) ? fmt(r.avg, 2) : "–"}</td>
        <td class="n kwh">${r.peak ? fmt(r.peak.v, 2) : "–"}${r.topPeak ? '<span class="tag-peak">HIGHEST</span>' : ""}</td>
        <td>${r.peak ? esc(fmtDateTime(r.peak.t)) + (r.peak.reverse ? " (reverse)" : "") : "–"}</td>
        <td class="n">${ph && ph.src ? fmtKwh(ph.kwh) : "–"}</td>
        <td class="n cost">${ph && ph.src ? esc(money(ph.kwh * rate, cur)) : "–"}</td>
        <td class="n">${isNum(r.lf) ? pct(r.lf) : "–"}</td>
        <td>${r.topBk ? esc(r.topBk.b.label) + "<br><small style=\"color:var(--muted)\">" + fmtKwh(r.topBk.kwh) + " kWh, " + esc(money(r.topBk.kwh * rate, cur)) + "</small>" : "–"}</td></tr>`;
    }).join("");
    return `<div class="card" style="margin-top:16px"><h2>SIDE-BY-SIDE COMPARISON</h2>
      <p class="sub">“× lowest” shows how many times more energy than the lowest machine. Load factor = average ÷ highest power. Peak hour = the clock hour of the highest reading.</p>
      <div class="tablebox" style="margin-top:0"><table>
        <thead><tr><th>Machine</th><th class="n">Energy (kWh)</th><th class="n">Cost (${esc(cur)})</th><th class="n">Share</th><th class="n">× lowest</th>
          <th class="n">Average power (kW)</th><th class="n">Highest power (kW)</th><th>Time of highest</th>
          <th class="n">kWh in peak hour</th><th class="n">Cost in peak hour</th><th class="n">Load factor</th><th>Highest-cost ${gw}</th></tr></thead>
        <tbody>${rows}<tr class="sum"><td>Total</td><td class="n">${fmtKwh(C.total)}</td><td class="n">${esc(money(C.cost, cur))}</td><td class="n">100%</td><td colspan="8"></td></tr></tbody>
      </table></div></div>`;
  }

  function periodTable(C) {
    const { cur, rate, group } = state, gw = GROUP_WORD[group];
    const rows = C.bks.map(b => `<tr><td>${esc(b.label)}</td>
      ${C.list.map((r, i) => { const v = r.bk[C.bks.indexOf(b)];
        return `<td class="n${i === b.leader ? " lead" : ""}">${v === null ? "–" : fmtKwh(v) + "<br><small>" + esc(money(v * rate, cur)) + "</small>"}</td>`; }).join("")}
      <td class="n kwh">${b.has ? fmtKwh(b.total) + "<br><small>" + esc(money(b.total * rate, cur)) + "</small>" : "–"}</td>
      <td>${b.leader >= 0 ? esc(C.list[b.leader].m.label) : "–"}</td></tr>`).join("");
    return `<div class="card" style="margin-top:16px"><h2>MACHINE BY MACHINE, PER ${gw.toUpperCase()}</h2>
      <p class="sub">kWh with cost below. The machine that used the most in each ${gw} is highlighted.</p>
      <div class="tablebox" style="margin-top:0"><table class="cmp-table">
        <thead><tr><th>${gw === "hour" ? "Hour (PKT)" : gw === "day" ? "Day" : "Month"}</th>${C.list.map(r => `<th class="n"><span class="dot" style="--c:${r.color}"></span> ${esc(r.m.label)}</th>`).join("")}<th class="n">Total</th><th>Highest</th></tr></thead>
        <tbody>${rows}<tr class="sum"><td>Total</td>${C.list.map(r => `<td class="n">${fmtKwh(r.kwh)}<br><small>${esc(money(r.cost, cur))}</small></td>`).join("")}
          <td class="n">${fmtKwh(C.total)}<br><small>${esc(money(C.cost, cur))}</small></td><td></td></tr></tbody>
      </table></div></div>`;
  }

  function summary(C) {
    const { cur, rate, range, group } = state, gw = GROUP_WORD[group];
    const out = [];
    out.push(`From ${esc(fmtRange(range))} the ${C.list.length} compared machines used <b>${fmtKwh(C.total)} kWh</b> together, costing <b>${esc(money(C.cost, cur))}</b> at ${esc(cur)} ${fmt(rate, 2)} per kWh.`);
    const E = C.byEnergy;
    if (E.length > 1) {
      const top = E[0], low = E[E.length - 1];
      out.push(`<b>${esc(top.m.label)}</b> used the most: ${fmtKwh(top.kwh)} kWh costing <b>${esc(money(top.cost, cur))}</b>, ${pct(top.share)} of the compared total. ` +
        `<b>${esc(low.m.label)}</b> used the least: ${fmtKwh(low.kwh)} kWh, ${esc(money(low.cost, cur))}. ` +
        (low.kwh > 0 ? `${esc(top.m.label)} used ${(top.kwh / low.kwh).toFixed(1)} times as much, a cost difference of ${esc(money(top.cost - low.cost, cur))}.` : ""));
      if (E.length > 2) out.push(`In between: ${E.slice(1, -1).map(r => esc(r.m.label) + " " + fmtKwh(r.kwh) + " kWh (" + esc(money(r.cost, cur)) + ")").join(", ")}.`);
    }
    const P = C.byPeak;
    if (P.length) {
      const t = P[0], ph = t.peakHour, hs = Math.floor(t.peak.t / HOUR) * HOUR;
      let s = `The highest active power peak was <b>${fmt(t.peak.v, 2)} kW on ${esc(t.m.label)}</b>, on ${esc(fmtDate(t.peak.t))} at ${fmtTime(t.peak.t)} PKT.`;
      if (ph && ph.src) s += ` In that hour (${fmtTime(hs)}–${endTime(hs + HOUR)}) ${esc(t.m.label)} used ${fmtKwh(ph.kwh)} kWh, costing ${esc(money(ph.kwh * rate, cur))}.`;
      if (P.length > 1) s += ` The lowest peak was on ${esc(P[P.length - 1].m.label)} (${fmt(P[P.length - 1].peak.v, 2)} kW).`;
      out.push(s);
      const sameHour = P.filter(r => Math.floor(r.peak.t / HOUR) === Math.floor(t.peak.t / HOUR));
      if (sameHour.length > 1) out.push(`<span class="warn">${sameHour.map(r => esc(r.m.label)).join(", ")} all reached their highest power in the same hour. Peaks that happen together raise the plant's maximum demand.</span>`);
      const A = C.withData.filter(r => isNum(r.avg)).sort((a, b) => b.avg - a.avg);
      if (A.length > 1) out.push(`Average active power was highest on ${esc(A[0].m.label)} (${fmt(A[0].avg, 2)} kW) and lowest on ${esc(A[A.length - 1].m.label)} (${fmt(A[A.length - 1].avg, 2)} kW).`);
      const L = C.withData.filter(r => isNum(r.lf) && r.peak.v > 1).sort((a, b) => b.lf - a.lf);
      if (L.length > 1) out.push(`${esc(L[0].m.label)} ran the steadiest load (average is ${pct(L[0].lf)} of its peak). ${esc(L[L.length - 1].m.label)} was the most uneven (${pct(L[L.length - 1].lf)}), so short peaks matter more there.`);
    }
    const leads = [...C.withData].sort((a, b) => b.leads - a.leads);
    const nb = C.bks.filter(b => b.leader >= 0).length;
    if (nb > 1 && leads[0].leads) out.push(`${esc(leads[0].m.label)} was the biggest user in ${leads[0].leads} of ${nb} ${gw}s.`);
    const calc = C.list.filter(r => r.d.method === "power").map(r => esc(r.m.label));
    if (calc.length) out.push(`<span class="warn">Energy of ${calc.join(", ")} was calculated from active power, because ${calc.length > 1 ? "their energy counters" : "its energy counter"} did not count in this period.</span>`);
    if (C.missing.length) out.push(`<span class="warn">No readings at all from ${C.missing.map(r => esc(r.m.label)).join(", ")}, so ${C.missing.length > 1 ? "they are" : "it is"} left out of the comparison.</span>`);
    return out.map(x => `<p>${x}</p>`).join("");
  }

  function explanation() {
    const { cur, rate, group } = state, gw = GROUP_WORD[group];
    return `
      <p><b>Energy and cost.</b> Each machine's energy comes from the hourly increase of its kWh counter. Where the counter does not count or a reading is clearly wrong, that hour is calculated from the average active power. Cost = kWh × ${esc(cur)} ${fmt(rate, 2)}. Every machine uses the same rate, so the cost ranking is the same as the energy ranking.</p>
      <p><b>Active power.</b> “Average power” is the average of the hourly averages over the period. “Highest power” is the single highest reading the logger stored, with its exact time. If a meter's CT is reversed, its load shows as negative power; the comparison uses the size of the reading and marks it “reverse”. The peak hour's kWh and cost are that machine's energy in the clock hour of its peak.</p>
      <p><b>Load factor</b> is average power ÷ highest power. Near 100% means the machine runs at a steady load. A low value means short, high peaks compared with its normal running.</p>
      <p><b>Per ${gw}.</b> The hourly energy of each machine is added up for each ${gw} by Pakistan time. Hours without readings are left empty; with counter meters, energy used during a gap appears in the next hour with readings.</p>`;
  }

  function downloadCsv() {
    const { range, cur, rate, group } = state, C = state.c;
    const q = s => '"' + String(s).replace(/"/g, '""') + '"', line = a => a.map(q).join(",");
    const L = [line(["Toyo Packaging", "Machine comparison"]), line(["Period", fmtRange(range)]), line(["Per unit cost", cur + " " + rate.toFixed(2) + " per kWh"]),
      line(["Generated", fmtDateTime(state.generated) + " PKT"]), "",
      line(["Machine", "Energy kWh", "Cost " + cur, "Share %", "Average power kW", "Highest power kW", "Time of highest", "kWh in peak hour", "Cost in peak hour", "Load factor %", "Highest-cost " + GROUP_WORD[group], "kWh in it"])];
    [...C.ranked, ...C.missing].forEach(r => L.push(line([r.m.label, r.kwh.toFixed(2), r.cost.toFixed(2), (r.share * 100).toFixed(1),
      isNum(r.avg) ? r.avg.toFixed(2) : "", r.peak ? r.peak.v.toFixed(2) : "", r.peak ? fmtDateTime(r.peak.t) : "",
      r.peakHour && r.peakHour.src ? r.peakHour.kwh.toFixed(2) : "", r.peakHour && r.peakHour.src ? (r.peakHour.kwh * rate).toFixed(2) : "",
      isNum(r.lf) ? (r.lf * 100).toFixed(1) : "", r.topBk ? r.topBk.b.label : "", r.topBk ? r.topBk.kwh.toFixed(2) : ""])));
    L.push("", line([GROUP_WORD[group], ...C.list.flatMap(r => [r.m.label + " kWh", r.m.label + " " + cur]), "Total kWh", "Total " + cur]));
    C.bks.forEach((b, i) => L.push(line([b.label, ...C.list.flatMap(r => r.bk[i] === null ? ["", ""] : [r.bk[i].toFixed(2), (r.bk[i] * rate).toFixed(2)]),
      b.total.toFixed(2), (b.total * rate).toFixed(2)])));
    const blob = new Blob(["\ufeff" + L.join("\r\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "Toyo machine comparison " + toDateStr(range.start) + ".csv";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  updateRangeText(true);
  updateCount();
}


document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
  ["dist", "gen", "cmp"].forEach(k => document.getElementById("sec-" + k).hidden = btn.dataset.tab !== k);
}));

buildSection("dist");
buildSection("gen");
buildCompare();

function tickClock() {
  const t = P(Date.now());
  document.getElementById("siteDate").textContent = DAYS[t.getUTCDay()] + ", " + t.getUTCDate() + " " + MONTHS[t.getUTCMonth()] + " " + t.getUTCFullYear();
  document.getElementById("siteTime").textContent = pad(t.getUTCHours()) + ":" + pad(t.getUTCMinutes()) + ":" + pad(t.getUTCSeconds());
}
tickClock(); setInterval(tickClock, 1000);
document.getElementById("backLink").href = CONFIG.dashboardPage;
document.getElementById("footSrc").textContent = "TOYO ENERGY CLOUD";
</script>
